name: Bug report
description: Create a report to help us improve
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us, what did you expect to happen?
      placeholder: Tell us what you see!
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Which AI Agent were you using?
      options:
        - Claude Code
        - Cursor
        - Roo Code
        - Windsurf
        - Other (please specify in description)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Terminal Output / Logs
      description: Please provide the command you ran and its output.
      render: shell
